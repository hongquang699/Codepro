<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đặt lại mật khẩu | CodeProOJ</title>
  <link rel="icon" type="image/svg+xml" href="/frontend/assets/icons/favicon.svg">
  <link rel="stylesheet" href="/frontend/css/global/reset.css">
  <link rel="stylesheet" href="/frontend/css/global/variables.css">
  <link rel="stylesheet" href="/frontend/css/global/icons.css">
  <link rel="stylesheet" href="/frontend/css/auth/password.css">
  <script src="/frontend/js/core/icons.js"></script>
  <link rel="stylesheet" href="/frontend/css/global/site-refresh.css">
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-card password-card">
      <div class="auth-header">
        <a href="/" class="auth-logo-wrap" title="Về trang chủ">
          <svg width="32" height="32" viewBox="0 0 36 36" fill="none">
            <rect width="36" height="36" rx="8" fill="#2563EB"/>
            <path d="M12 12L7 20L12 28M24 12L29 20L24 28M19 10L17 30" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
          </svg>
        </a>
        <h1 class="auth-title">Đặt lại mật khẩu mới</h1>
        <p class="auth-subtitle">Vui lòng nhập mật khẩu mới bảo mật cho tài khoản của bạn</p>
      </div>

      <div id="authAlert" class="auth-alert"></div>

      <form id="resetForm" class="auth-form">
        <div class="auth-form-group">
          <label class="auth-label" for="password">Mật khẩu mới</label>
          <div class="auth-input-wrap">
            <input type="password" id="password" class="auth-input" placeholder="Tối thiểu 8 ký tự" required autocomplete="new-password" autofocus>
            <button type="button" id="togglePasswordBtn" class="auth-input-icon" aria-label="Hiện mật khẩu">
              <i data-icon="eye"></i>
            </button>
          </div>
        </div>

        <div class="auth-form-group">
          <label class="auth-label" for="passwordConfirm">Xác nhận mật khẩu mới</label>
          <div class="auth-input-wrap">
            <input type="password" id="passwordConfirm" class="auth-input" placeholder="Nhập lại mật khẩu mới" required autocomplete="new-password">
            <button type="button" id="toggleConfirmPasswordBtn" class="auth-input-icon" aria-label="Hiện mật khẩu">
              <i data-icon="eye"></i>
            </button>
          </div>
        </div>

        <div class="password-guidelines">
          <strong>Lưu ý bảo mật:</strong>
          <ul>
            <li>Mật khẩu dài từ 8 đến 128 ký tự.</li>
            <li>Nên bao gồm cả chữ hoa, chữ thường và chữ số.</li>
          </ul>
        </div>

        <button type="submit" id="resetSubmitBtn" class="auth-btn-primary">
          <span>LƯU MẬT KHẨU MỚI</span>
        </button>
      </form>

      <div class="auth-footer">
        <a href="/login" class="auth-link">Quay lại đăng nhập</a>
      </div>
    </div>
  </div>

  <script src="/frontend/js/auth/auth.js"></script>
  <script src="/frontend/js/auth/reset-password.js"></script>
</body>
</html>
