<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quên mật khẩu | CodeProOJ</title>
  <link rel="icon" type="image/svg+xml" href="/frontend/assets/icons/favicon.svg">
  <link rel="stylesheet" href="/frontend/css/global/reset.css">
  <link rel="stylesheet" href="/frontend/css/global/variables.css">
  <link rel="stylesheet" href="/frontend/css/global/icons.css">
  <link rel="stylesheet" href="/frontend/css/auth/password.css">
  <script src="/frontend/js/core/icons.js"></script>
  <link rel="stylesheet" href="/frontend/css/global/site-refresh.css">
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-card password-card">
      <div class="auth-header">
        <a href="/" class="auth-logo-wrap" title="Về trang chủ">
          <svg width="32" height="32" viewBox="0 0 36 36" fill="none">
            <rect width="36" height="36" rx="8" fill="#2563EB"/>
            <path d="M12 12L7 20L12 28M24 12L29 20L24 28M19 10L17 30" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
          </svg>
        </a>
        <h1 class="auth-title">Khôi phục mật khẩu</h1>
        <p class="auth-subtitle">Nhập email hoặc tên đăng nhập của bạn để nhận liên kết khôi phục</p>
      </div>

      <div id="authAlert" class="auth-alert"></div>

      <form id="forgotForm" class="auth-form">
        <div class="auth-form-group">
          <label class="auth-label" for="identifier">Username / Email</label>
          <div class="auth-input-wrap">
            <input type="text" id="identifier" class="auth-input" placeholder="Nhập tên đăng nhập hoặc email" required autofocus>
          </div>
        </div>

        <button type="submit" id="forgotSubmitBtn" class="auth-btn-primary">
          <span>GỬI HƯỚNG DẪN</span>
        </button>
      </form>

      <div class="auth-footer">
        Đã nhớ mật khẩu? <a href="/login" class="auth-link">Quay lại đăng nhập</a>
      </div>
    </div>
  </div>

  <script src="/frontend/js/auth/auth.js"></script>
  <script src="/frontend/js/auth/forgot-password.js"></script>
</body>
</html>
