# Install on the VPS host after obtaining a certificate for these domains.
# The container gateway only listens on 127.0.0.1:8080 of this host.
server {
    listen 80;
    server_name codeprooj.com www.codeprooj.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name codeprooj.com www.codeprooj.com;

    ssl_certificate /etc/letsencrypt/live/codeprooj.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/codeprooj.com/privkey.pem;
    client_max_body_size 110m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }
}
