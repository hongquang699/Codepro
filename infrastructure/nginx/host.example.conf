# Install on the VPS host after obtaining a certificate for these domains.
# The container gateway only listens on 127.0.0.1:8080 of this host.
server {
    listen 80;
    server_name codeprooj.com www.codeprooj.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name codeprooj.com www.codeprooj.com;

    ssl_certificate /etc/letsencrypt/live/codeprooj.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/codeprooj.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    client_max_body_size 110m;

    location /ws/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 75s;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }
}
