<!DOCTYPE html>
<html lang="vi">
<head>
  <link rel="icon" type="image/svg+xml" href="/frontend/assets/icons/favicon.svg">
  <link rel="stylesheet" href="/frontend/css/global/icons.css">
  <script src="/frontend/js/core/icons.js"></script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chi Tiết Bài Viết | CodeProOJ Community</title>
  <link rel="stylesheet" href="/frontend/css/global/reset.css">
  <link rel="stylesheet" href="/frontend/css/global/variables.css">
  <link rel="stylesheet" href="/frontend/css/global/typography.css">
  <link rel="stylesheet" href="/frontend/css/global/common.css">
  <link rel="stylesheet" href="/frontend/css/components/navbar.css">
  <link rel="stylesheet" href="/frontend/css/components/card.css">
  <link rel="stylesheet" href="/frontend/css/responsive/mobile.css">
  <link rel="stylesheet" href="/frontend/css/community/community.css">
  <link rel="stylesheet" href="/frontend/css/community/feed.css">
  <link rel="stylesheet" href="/frontend/css/global/theme.css">
  <link rel="stylesheet" href="/frontend/css/global/site-refresh.css">
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="/" class="nav-brand">
        <svg width="28" height="28" viewBox="0 0 36 36" fill="none"><rect width="36" height="36" rx="8" fill="#DC2626"/><path d="M12 12L7 20L12 28M24 12L29 20L24 28M19 10L17 30" stroke="white" stroke-width="2.5" stroke-linecap="round"/></svg>
        <span>CodeProOJ</span>
      </a>
      <div class="nav-links">
        <a href="/" class="nav-link">Trang chủ</a>
        <a href="/frontend/html/problem/index.html" class="nav-link">Bài tập</a>
        <a href="/frontend/html/contest/index.html" class="nav-link">Cuộc thi</a>
        <a href="/frontend/html/ranking/index.html" class="nav-link">Xếp hạng</a>
        <a href="/frontend/html/submission/index.html" class="nav-link">Bài nộp</a>
        <a href="/frontend/html/community/home/index.html" class="nav-link active">Cộng đồng</a>
      </div>
      <div class="nav-actions">
        <a href="/frontend/html/admin/dashboard.html" class="btn-nav btn-admin">Quản trị</a>
      </div>
    </div>
  </nav>

  <div class="comm-layout">
    <!-- Left Sidebar -->
    <aside class="comm-left-sidebar">
      <div class="comm-sidebar-card">
        <div class="comm-sidebar-title">Menu</div>
        <nav class="comm-nav-list">
          <a href="/frontend/html/community/home/index.html" class="comm-nav-link active">
            <span>&larr;</span> Về Trang chủ Feed
          </a>
          <a href="/frontend/html/community/forum/index.html" class="comm-nav-link">
            <span><cp-icon name="send" size="sm"></cp-icon> </span> Diễn đàn thảo luận
          </a>
        </nav>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="comm-main" style="grid-column: span 2;">
      <article class="comm-card">
        <h1 style="font-size:1.6rem;color: var(--color-text);font-weight:800;margin-bottom:0.75rem;line-height:1.4;" id="postDetailTitle">
          Đang tải bài viết...
        </h1>

        <div style="display:flex;align-items:center;gap:0.75rem;margin-bottom:1.5rem;padding-bottom:1rem;border-bottom: 1px solid rgba(255,255,255,0.06);">
          <div class="comm-avatar">U</div>
          <div>
            <div style="font-weight:700;color: #fff;" id="postDetailAuthor">—</div>
            <div class="comm-time-meta" id="postDetailDate">—</div>
          </div>
        </div>

        <div class="comm-post-content" id="postDetailContent" style="font-size:1rem;line-height:1.7;"></div>

        <div class="comm-tag-list" id="postDetailTags" style="margin-top:1.5rem;"></div>

        <div class="comm-action-bar">
          <button class="comm-btn-act" id="btnLikePost">
            👍 <span id="postLikeCount">0</span> Thích bài viết
          </button>
        </div>
      </article>

      <!-- Comments Section -->
      <section class="comm-card" id="comments">
        <h3 style="color: var(--color-text);font-size:1.15rem;font-weight:700;margin-bottom:1rem;">Bình Luận &amp; Thảo Luận</h3>

        <!-- Comment Composer -->
        <div style="margin-bottom:1.5rem;">
          <textarea id="commentInput" placeholder="Nhập bình luận hoặc góp ý của bạn..." class="comm-composer-input" style="min-height:80px;margin-bottom:0.6rem;"></textarea>
          <button id="btnSubmitComment" class="comm-btn-primary">Gửi bình luận</button>
        </div>

        <!-- Comments List -->
        <div id="commentsList">
          <div style="color: var(--color-text-dim);font-size:0.88rem;">Đang tải bình luận...</div>
        </div>
      </section>
    </main>
  </div>

  <script src="/frontend/js/core/config.js"></script>
  <script src="/frontend/js/community/api.js"></script>
  <script src="/frontend/js/community/post-detail.js"></script>
  <script src="/frontend/js/core/theme.js"></script>
  <script src="/frontend/js/core/i18n.js"></script>
</body>
</html>
