<!DOCTYPE html>
<html lang="vi">
<head>
  <link rel="icon" type="image/svg+xml" href="/frontend/assets/icons/favicon.svg">
  <link rel="stylesheet" href="/frontend/css/global/icons.css">
  <script src="/frontend/js/core/icons.js"></script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lịch sử bài nộp | CodeProOJ</title>
  <link rel="stylesheet" href="/frontend/css/global/reset.css">
  <link rel="stylesheet" href="/frontend/css/global/variables.css">
  <link rel="stylesheet" href="/frontend/css/global/typography.css">
  <link rel="stylesheet" href="/frontend/css/global/common.css">
  <link rel="stylesheet" href="/frontend/css/components/navbar.css">
  <link rel="stylesheet" href="/frontend/css/profile/profile.css">
  <style>
    .filter-bar {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-bottom: 1.25rem;
      align-items: center;
    }
    .filter-input, .filter-select {
      background: var(--color-bg-secondary);
      border: 1px solid var(--profile-border);
      color: var(--color-text);
      padding: 0.5rem 0.85rem;
      border-radius: 6px;
      font-size: 0.85rem;
      outline: none;
    }
    .filter-input:focus, .filter-select:focus {
      border-color: var(--color-primary);
    }
    .pagination-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1.5rem;
      font-size: 0.85rem;
      color: var(--profile-muted);
    }
    .page-btn {
      background: var(--color-card);
      border: 1px solid var(--profile-border);
      color: var(--color-text);
      padding: 0.4rem 0.9rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .page-btn:hover { background: var(--color-surface-hover); }
    .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
  <link rel="stylesheet" href="/frontend/css/global/theme.css">
  <link rel="stylesheet" href="/frontend/css/global/site-refresh.css">
</head>
<body>
  <header class="navbar">
    <div class="container nav-container"></div>
  </header>

  <main class="profile-container">
    <div id="profileHeaderContainer">
      <div style="text-align: center; color: var(--color-text-muted); padding: 3rem;">Đang tải thông tin hồ sơ...</div>
    </div>

    <div class="profile-card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; flex-wrap: wrap; gap: 0.5rem;">
        <h3 class="profile-card-title" style="margin: 0;"><cp-icon name="document" size="sm"></cp-icon> Lịch sử bài nộp (Submission History)</h3>
        <span id="subsCountBadge" style="font-size: 0.85rem; color: var(--color-text-muted);">Đang tải...</span>
      </div>

      <!-- Filters -->
      <div class="filter-bar">
        <input type="text" id="filterProb" class="filter-input" placeholder="Mã bài (vd: SUMA)" style="width: 140px;">
        <select id="filterVerdict" class="filter-select">
          <option value="">Tất cả kết quả (Verdict)</option>
          <option value="AC">Accepted (AC)</option>
          <option value="WA">Wrong Answer (WA)</option>
          <option value="TLE">Time Limit Exceeded (TLE)</option>
          <option value="MLE">Memory Limit Exceeded (MLE)</option>
          <option value="RTE">Runtime Error (RTE)</option>
          <option value="CE">Compilation Error (CE)</option>
        </select>
        <select id="filterLang" class="filter-select">
          <option value="">Tất cả ngôn ngữ</option>
          <option value="CPP">C++</option>
          <option value="PYTHON">Python</option>
          <option value="JAVA">Java</option>
          <option value="C">C</option>
          <option value="PAS">Pascal</option>
        </select>
        <button class="btn-profile-act primary" onclick="loadSubmissions(1)" style="padding: 0.45rem 1rem;">
          🔍 Lọc
        </button>
        <button class="btn-profile-act" onclick="resetFilters()" style="padding: 0.45rem 0.85rem;">
          Làm lại
        </button>
      </div>

      <div style="overflow-x: auto;">
        <table class="profile-table">
          <thead>
            <tr>
              <th style="width: 80px;">Mã</th>
              <th>Bài tập</th>
              <th style="width: 110px;">Ngôn ngữ</th>
              <th style="width: 100px;">Kết quả</th>
              <th style="width: 90px;">Điểm</th>
              <th style="width: 100px;">Thời gian</th>
              <th style="width: 100px;">Bộ nhớ</th>
              <th style="width: 150px;">Thời điểm</th>
            </tr>
          </thead>
          <tbody id="subsTableBody">
            <tr><td colspan="8" style="text-align: center; color: var(--color-text-muted); padding: 2.5rem;">Đang tải dữ liệu...</td></tr>
          </tbody>
        </table>
      </div>

      <!-- Pagination -->
      <div class="pagination-bar" id="paginationBar">
        <span id="pageInfo">Trang 1 / 1</span>
        <div style="display: flex; gap: 0.5rem;">
          <button class="page-btn" id="btnPrev" onclick="changePage(-1)" disabled>&larr; Trang trước</button>
          <button class="page-btn" id="btnNext" onclick="changePage(1)" disabled>Trang sau &rarr;</button>
        </div>
      </div>
    </div>
  </main>

  <script src="/frontend/js/core/config.js"></script>
  <script src="/frontend/js/core/auth.js"></script>
  <script src="/frontend/js/components/navbar.js"></script>
  <script src="/frontend/js/core/rating.js"></script>
  <script src="/frontend/js/profile/profile-api.js"></script>
  <script>
    const username = ProfileAPI.getUsernameFromUrl();
    let currentPage = 1;
    let totalPages = 1;

    async function init() {
      const data = await ProfileAPI.getOverview(username);
      document.title = `Bài nộp - ${data.profile.display_name || username} (@${username})`;
      ProfileAPI.renderHeader('profileHeaderContainer', data, 'submissions');
      loadSubmissions(1);
    }

    async function loadSubmissions(page = 1) {
      currentPage = page;
      const params = {
        page: currentPage,
        page_size: 20
      };
      const v = document.getElementById('filterVerdict').value;
      if (v) params.verdict = v;
      const p = document.getElementById('filterProb').value.trim();
      if (p) params.problem = p;
      const l = document.getElementById('filterLang').value;
      if (l) params.language = l;

      const tbody = document.getElementById('subsTableBody');
      tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; color: var(--color-text-muted); padding: 2rem;">Đang tải danh sách bài nộp...</td></tr>';

      try {
        const res = await ProfileAPI.getSubmissions(username, params);
        const list = res.results || [];
        const total = res.total || 0;
        totalPages = Math.max(1, Math.ceil(total / 20));

        document.getElementById('subsCountBadge').textContent = `Tổng cộng: ${total} bài nộp`;
        document.getElementById('pageInfo').textContent = `Trang ${currentPage} / ${totalPages} (${total} kết quả)`;
        document.getElementById('btnPrev').disabled = currentPage <= 1;
        document.getElementById('btnNext').disabled = currentPage >= totalPages;

        if (list.length === 0) {
          tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; color: var(--color-text-muted); padding: 2rem;">Không tìm thấy bài nộp nào phù hợp.</td></tr>';
          return;
        }

        tbody.innerHTML = list.map(s => {
          const v = s.result || 'WA';
          let vClass = 'verdict-wa';
          if (v === 'AC') vClass = 'verdict-ac';
          else if (v === 'TLE') vClass = 'verdict-tle';
          else if (v === 'RTE') vClass = 'verdict-rte';
          else if (v === 'CE') vClass = 'verdict-ce';

          return `
            <tr>
              <td><a href="/submissions/${s.id}" style="color: var(--color-primary); font-weight:700; text-decoration:none;">#${s.id}</a></td>
              <td>
                <a href="/problems/${s.problem_code}" style="color: var(--color-text); font-weight:600; text-decoration:none;">
                  <span style="font-family:monospace; color: var(--color-primary);">${s.problem_code}</span> - ${s.problem_name || s.problem_code}
                </a>
              </td>
              <td style="color: var(--color-text-muted); font-family:monospace;">${s.language}</td>
              <td><span class="verdict-pill ${vClass}">${v}</span></td>
              <td style="font-weight:700; color: #34d399;">${s.score ?? 0}</td>
              <td style="font-family:monospace; color: var(--color-text-secondary);">${s.time_ms != null ? s.time_ms + ' ms' : '—'}</td>
              <td style="font-family:monospace; color: var(--color-text-secondary);">${s.memory_kb != null ? Math.round(s.memory_kb / 1024) + ' MB' : '—'}</td>
              <td style="color: var(--color-text-muted); font-size:0.82rem;">${s.date || '—'}</td>
            </tr>
          `;
        }).join('');
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="8" style="text-align: center; color: #ef4444; padding: 2rem;">Lỗi tải bài nộp: ${err.message}</td></tr>`;
      }
    }

    function changePage(delta) {
      const p = currentPage + delta;
      if (p >= 1 && p <= totalPages) {
        loadSubmissions(p);
      }
    }

    function resetFilters() {
      document.getElementById('filterProb').value = '';
      document.getElementById('filterVerdict').value = '';
      document.getElementById('filterLang').value = '';
      loadSubmissions(1);
    }

    init();
  </script>
  <script src="/frontend/js/core/theme.js"></script>
  <script src="/frontend/js/core/i18n.js"></script>
</body>
</html>
