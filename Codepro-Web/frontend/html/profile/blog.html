<!DOCTYPE html>
<html lang="vi">
<head>
  <link rel="icon" type="image/svg+xml" href="/frontend/assets/icons/favicon.svg">
  <link rel="stylesheet" href="/frontend/css/global/icons.css">
  <script src="/frontend/js/core/icons.js"></script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài viết & Chia sẻ | CodeProOJ</title>
  <link rel="stylesheet" href="/frontend/css/global/reset.css">
  <link rel="stylesheet" href="/frontend/css/global/variables.css">
  <link rel="stylesheet" href="/frontend/css/global/typography.css">
  <link rel="stylesheet" href="/frontend/css/global/common.css">
  <link rel="stylesheet" href="/frontend/css/components/navbar.css">
  <link rel="stylesheet" href="/frontend/css/profile/profile.css">
  <link rel="stylesheet" href="/frontend/css/global/theme.css">
  <link rel="stylesheet" href="/frontend/css/global/site-refresh.css">
</head>
<body>
  <header class="navbar">
    <div class="container nav-container"></div>
  </header>

  <main class="profile-container">
    <div id="profileHeaderContainer">
      <div style="text-align: center; color: var(--color-text-muted); padding: 3rem;">Đang tải thông tin hồ sơ...</div>
    </div>

    <div class="profile-card">
      <h3 class="profile-card-title">✍️ Bài viết & Thảo luận (Blog & Posts)</h3>
      <div id="blogList" style="display: flex; flex-direction: column; gap: 1rem;">
        <div style="color: var(--color-text-muted); padding: 1rem 0;">Đang tải bài viết...</div>
      </div>
    </div>
  </main>

  <script src="/frontend/js/core/config.js"></script>
  <script src="/frontend/js/core/auth.js"></script>
  <script src="/frontend/js/components/navbar.js"></script>
  <script src="/frontend/js/core/rating.js"></script>
  <script src="/frontend/js/profile/profile-api.js"></script>
  <script>
    const username = ProfileAPI.getUsernameFromUrl();

    async function init() {
      const data = await ProfileAPI.getOverview(username);
      document.title = `Blog - ${data.profile.display_name || username} (@${username})`;
      ProfileAPI.renderHeader('profileHeaderContainer', data, 'blog');

      try {
        const res = await ProfileAPI.getBlog(username);
        const list = res.results || [];
        const container = document.getElementById('blogList');

        if (list.length === 0) {
          container.innerHTML = '<div style="color: var(--color-text-muted); padding: 1.5rem 0;">Tác giả này chưa đăng bài viết nào trên diễn đàn.</div>';
          return;
        }

        container.innerHTML = list.map(b => `
          <div style="background: var(--color-bg-secondary); border: 1px solid var(--profile-border); border-radius: 10px; padding: 1.25rem;">
            <a href="${b.link || '#'}" style="font-size: 1.15rem; font-weight: 700; color: var(--color-primary); text-decoration: none;">
              ${b.title}
            </a>
            <div style="font-size: 0.82rem; color: var(--color-text-muted); margin: 0.35rem 0 0.65rem;">
              Đăng ngày: ${b.created_at} • Lượt xem: ${b.views}
            </div>
            <p style="color: var(--color-text-secondary); font-size: 0.9rem; line-height: 1.5; margin: 0;">
              ${b.excerpt}
            </p>
          </div>
        `).join('');
      } catch (err) {
        console.error(err);
      }
    }

    init();
  </script>
  <script src="/frontend/js/core/theme.js"></script>
  <script src="/frontend/js/core/i18n.js"></script>
</body>
</html>
