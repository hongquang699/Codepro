<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản Lý Thí Sinh &amp; Đội Thi | Contest Admin</title>
  <link rel="icon" type="image/svg+xml" href="/frontend/assets/icons/favicon.svg">
  <link rel="stylesheet" href="/frontend/css/global/reset.css">
  <link rel="stylesheet" href="/frontend/css/global/variables.css">
  <link rel="stylesheet" href="/frontend/css/global/typography.css">
  <link rel="stylesheet" href="/frontend/css/global/common.css">
  <link rel="stylesheet" href="/frontend/css/global/icons.css">
  <link rel="stylesheet" href="/frontend/css/components/navbar.css">
  <link rel="stylesheet" href="/frontend/css/contest-admin/contest-admin.css">
  <link rel="stylesheet" href="/frontend/css/global/theme.css">
  <script src="/frontend/js/core/icons.js"></script>
  <link rel="stylesheet" href="/frontend/css/global/site-refresh.css">
</head>
<body>
  <header class="navbar">
    <div class="container nav-container"></div>
  </header>

  <div class="ca-layout">
    <aside class="ca-sidebar" id="caSidebarTarget"></aside>

    <main class="ca-main">
      <div id="caHeaderTarget"></div>

      <div class="ca-panel">
        <div class="ca-panel-header">
          <h3 class="ca-panel-title">👥 Danh Sách Thí Sinh Tham Gia Kỳ Thi</h3>
          <div>
            <button onclick="openAddParticipantModal()" class="ca-btn ca-btn-primary">
              <cp-icon name="plus" size="sm"></cp-icon> Thêm Thí Sinh
            </button>
          </div>
        </div>
        <div style="overflow-x:auto;">
          <table class="ca-table">
            <thead>
              <tr>
                <th style="width:70px;text-align:center;">Hạng</th>
                <th>Tài Khoản (User)</th>
                <th style="text-align:center;">Rating</th>
                <th style="text-align:center;">Trạng Thái</th>
                <th style="text-align:center;">Điểm Số</th>
                <th style="text-align:center;">Bài Nộp</th>
                <th style="text-align:right;">Thao Tác</th>
              </tr>
            </thead>
            <tbody id="partsTbody">
              <tr><td colspan="7" style="text-align:center;padding:2.5rem;color: var(--color-text-muted);">Đang tải danh sách thí sinh...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Add Participant Modal -->
  <div class="ca-modal-overlay" id="addPartModal">
    <div class="ca-modal-box">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem;">
        <h3 style="margin:0;color: var(--color-text);font-size:1.15rem;">➕ Thêm Thí Sinh Vào Kỳ Thi</h3>
        <button onclick="closeAddPartModal()" style="background: none;border: none;color: var(--color-text-muted);font-size:1.3rem;cursor:pointer;">&times;</button>
      </div>
      <form onsubmit="event.preventDefault(); submitAddPart();">
        <div class="ca-form-group">
          <label class="ca-form-label">Tên tài khoản (Username) *</label>
          <input type="text" id="add_part_user" required class="ca-input" placeholder="Nhập username thí sinh...">
        </div>
        <div style="display:flex;justify-content:flex-end;gap:.75rem;margin-top:1.5rem;">
          <button type="button" onclick="closeAddPartModal()" class="ca-btn ca-btn-secondary">Hủy</button>
          <button type="submit" class="ca-btn ca-btn-primary">Thêm vào kỳ thi</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Ban Modal -->
  <div class="ca-modal-overlay" id="banModal">
    <div class="ca-modal-box">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem;">
        <h3 id="banModalTitle" style="margin:0;color: #ef4444;font-size:1.15rem;">🚫 Cấm / Truất Quyền Thi Đấu</h3>
        <button onclick="closeBanModal()" style="background: none;border: none;color: var(--color-text-muted);font-size:1.3rem;cursor:pointer;">&times;</button>
      </div>
      <form onsubmit="event.preventDefault(); submitBan();">
        <input type="hidden" id="ban_username">
        <div class="ca-form-group">
          <label class="ca-form-label">Lý do cấm / truất quyền *</label>
          <textarea id="ban_reason" required class="ca-textarea" rows="3" placeholder="Gian lận mã nguồn, sao chép bài, vi phạm quy chế..."></textarea>
        </div>
        <div style="display:flex;justify-content:flex-end;gap:.75rem;">
          <button type="button" onclick="closeBanModal()" class="ca-btn ca-btn-secondary">Hủy</button>
          <button type="submit" class="ca-btn ca-btn-danger">Xác nhận cấm thi</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/frontend/js/core/config.js"></script>
  <script src="/frontend/js/core/auth.js"></script>
  <script src="/frontend/js/components/navbar.js"></script>
  <script src="/frontend/js/contest-admin/contest-admin-api.js"></script>
  <script src="/frontend/js/contest-admin/contest-admin.js"></script>
  <script>
    const contestKey = ContestAdminAPI.getContestKey();
    ContestAdminUI.renderSidebar('participants', contestKey);
    ContestAdminUI.renderHeader('Quản Lý Thí Sinh', `Danh sách thí sinh và xử lý gian lận kỳ thi ${contestKey}`);

    async function loadParticipants() {
      const res = await ContestAdminAPI.getParticipants(contestKey);
      const tbody = document.getElementById('partsTbody');
      if (!res.data || res.data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:2.5rem;color: var(--color-text-muted);">Chưa có thí sinh nào đăng ký tham gia kỳ thi.</td></tr>';
        return;
      }

      tbody.innerHTML = res.data.map(p => `
        <tr>
          <td style="text-align:center;font-weight:800;color: var(--color-primary);">#${p.rank}</td>
          <td>
            <a href="/profile/${p.username}" target="_blank" style="font-weight:700;color: #fff;text-decoration:none;">${p.username}</a>
            <div style="font-size:.72rem;color: var(--color-text-muted);">${p.display_name}</div>
          </td>
          <td style="text-align:center;font-weight:700;">${p.rating}</td>
          <td style="text-align:center;">
            <span class="ca-badge ${p.status === 'Active' ? 'ca-badge-running' : 'ca-badge-frozen'}" style="${p.status === 'Banned' ? 'background: rgba(239,68,68,.15);color: #ef4444;border-color: rgba(239,68,68,.3);' : ''}">
              ${p.status.toUpperCase()}
            </span>
          </td>
          <td style="text-align:center;font-weight:800;color: #34d399;">${p.score}</td>
          <td style="text-align:center;font-weight:700;">${p.submissions_count}</td>
          <td style="text-align:right;white-space:nowrap;">
            ${p.status === 'Active' ? `
              <button onclick="openBanModal('${p.username}')" class="ca-btn ca-btn-danger" style="padding:.28rem .6rem;font-size:.76rem;margin-right:3px;">
                Cấm thi
              </button>
            ` : `
              <button onclick="unbanUser('${p.username}')" class="ca-btn ca-btn-success" style="padding:.28rem .6rem;font-size:.76rem;margin-right:3px;">
                Gỡ cấm
              </button>
            `}
            <button onclick="resetUser('${p.username}')" class="ca-btn ca-btn-secondary" style="padding:.28rem .6rem;font-size:.76rem;">
              Reset bài
            </button>
          </td>
        </tr>
      `).join('');
    }

    function openAddParticipantModal() {
      document.getElementById('addPartModal').classList.add('open');
    }
    function closeAddPartModal() {
      document.getElementById('addPartModal').classList.remove('open');
    }

    async function submitAddPart() {
      const username = document.getElementById('add_part_user').value.trim();
      const res = await ContestAdminAPI.participantAction(contestKey, 'add', username);
      alert(res.message || res.error);
      if (res.status === 200) {
        closeAddPartModal();
        loadParticipants();
      }
    }

    function openBanModal(username) {
      document.getElementById('banModalTitle').textContent = `Truất quyền thi đấu: ${username}`;
      document.getElementById('ban_username').value = username;
      document.getElementById('banModal').classList.add('open');
    }
    function closeBanModal() {
      document.getElementById('banModal').classList.remove('open');
    }

    async function submitBan() {
      const username = document.getElementById('ban_username').value;
      const reason = document.getElementById('ban_reason').value.trim();
      const res = await ContestAdminAPI.participantAction(contestKey, 'ban', username, { reason });
      alert(res.message || res.error);
      closeBanModal();
      loadParticipants();
    }

    async function unbanUser(username) {
      if (!confirm(`Xác nhận gỡ cấm thi đấu cho thí sinh ${username}?`)) return;
      const res = await ContestAdminAPI.participantAction(contestKey, 'unban', username);
      alert(res.message || res.error);
      loadParticipants();
    }

    async function resetUser(username) {
      if (!confirm(`CẢNH BÁO: Bạn có chắc chắn muốn xóa toàn bộ bài nộp và reset điểm của ${username}?`)) return;
      const res = await ContestAdminAPI.participantAction(contestKey, 'reset', username);
      alert(res.message || res.error);
      loadParticipants();
    }

    loadParticipants();
  </script>
</body>
</html>
