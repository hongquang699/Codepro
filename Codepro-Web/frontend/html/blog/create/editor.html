  <script>
    function renderLivePreview() {
      const raw = document.getElementById('postContent').value;
      // Simple lightweight markdown parser for preview
      let html = raw
        .replace(/^# (.*$)/gim, '<h1>$1</h1>')
        .replace(/^## (.*$)/gim, '<h2>$1</h2>')
        .replace(/^### (.*$)/gim, '<h3>$1</h3>')
        .replace(/```cpp([\s\S]*?)```/gim, '<pre><code>$1</code></pre>')
        .replace(/```([\s\S]*?)```/gim, '<pre><code>$1</code></pre>')
        .replace(/\*\*(.*?)\*\*/gim, '<strong>$1</strong>')
        .replace(/\n/gim, '<br>');
      document.getElementById('previewArea').innerHTML = html;
    }
    renderLivePreview();

    function publishPost() {
      const title = document.getElementById('postTitle').value;
      if (!title) return alert('Vui lòng nhập tiêu đề bài viết!');
      alert('Chúc mừng! Bài viết "' + title + '" đã được xuất bản lên CodeProOJ Blog.');
      window.location.href = '/frontend/html/blog/index.html';
    }
  </script>
