<!DOCTYPE html>
<html lang="vi">
<head>
  <link rel="icon" type="image/svg+xml" href="/frontend/assets/icons/favicon.svg">
  <link rel="stylesheet" href="/frontend/css/global/icons.css">
  <script src="/frontend/js/core/icons.js"></script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bảng Điểm Cuộc Thi | CodeProOJ Scoreboard</title>
  <link rel="stylesheet" href="/frontend/css/global/reset.css">
  <link rel="stylesheet" href="/frontend/css/global/variables.css">
  <link rel="stylesheet" href="/frontend/css/global/typography.css">
  <link rel="stylesheet" href="/frontend/css/global/common.css">
  <link rel="stylesheet" href="/frontend/css/components/navbar.css">
  <link rel="stylesheet" href="/frontend/css/components/card.css">
  <link rel="stylesheet" href="/frontend/css/components/table.css">
  <link rel="stylesheet" href="/frontend/css/responsive/mobile.css">
  <link rel="stylesheet" href="/frontend/css/contest/contest-flow.css">
  <link rel="stylesheet" href="/frontend/css/global/theme.css">
  <link rel="stylesheet" href="/frontend/css/global/site-refresh.css">
</head>
<body>
  <!-- Header Navbar -->
  <header class="navbar">
    <div class="container nav-container"></div>
  </header>

  <main class="container" style="padding-top: 1.5rem; padding-bottom: 4rem;">
    <!-- Contest Header Card -->
    <div class="contest-hero-card" style="padding: 1.25rem 1.75rem;">
      <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
        <div>
          <div style="display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.25rem;">
            <a href="/" style="color: var(--color-text-muted); text-decoration: none; font-size: 0.85rem; font-weight: 600;">
              &larr; Trang chủ
            </a>
            <span style="color: #475569;">•</span>
            <a id="backToDashLink" href="#" style="color: var(--color-primary); text-decoration: none; font-size: 0.9rem; font-weight: 600;">
              Quay lại Bảng điều khiển cuộc thi
            </a>
          </div>
          <h1 id="contestTitle" style="font-size: 1.5rem; color: var(--color-text); font-weight: 800; margin-top: 0.35rem;">
            BẢNG XẾP HẠNG THỜI GIAN THỰC
          </h1>
        </div>
        <div style="display: flex; gap: 0.75rem; align-items: center;">
          <div class="pulse-pill" style="display: inline-flex; align-items: center; gap: 0.5rem; background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.3); padding: 0.4rem 0.85rem; border-radius: 9999px; color: #34d399; font-size: 0.8rem; font-weight: 700;">
            <span style="width: 8px; height: 8px; background: #10b981; border-radius: 50%;"></span>
            REALTIME SCOREBOARD
          </div>
          <button id="btnReload" class="btn btn-secondary" style="font-size: 0.85rem; padding: 0.45rem 1rem;">
            🔄 Làm mới
          </button>
        </div>
      </div>
    </div>

    <!-- Scoreboard Table Container -->
    <div class="card" style="padding: 1.5rem; overflow-x: auto;">
      <div id="scoreboardWrapper">
        <div style="text-align: center; color: var(--color-text-muted); padding: 3rem;">Đang tải dữ liệu xếp hạng...</div>
      </div>
    </div>
  </main>

  <script src="/frontend/js/core/config.js"></script>
  <script src="/frontend/js/core/auth.js"></script>
  <script src="/frontend/js/components/navbar.js"></script>
  <script src="/frontend/js/contest/contest-api.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const contestKey = urlParams.get('contest') || 'hsg-tin-2026';
    document.getElementById('backToDashLink').href = `/frontend/html/contest/dashboard/index.html?contest=${contestKey}`;

    async function loadScoreboard() {
      const wrapper = document.getElementById('scoreboardWrapper');
      try {
        const json = await ContestAPI.getRanking(contestKey);
        const data = json.data;
        if (!data || !data.scoreboard) {
          wrapper.innerHTML = '<div style="text-align: center; color: var(--color-text-muted); padding: 2rem;">Chưa có dữ liệu bảng điểm.</div>';
          return;
        }

        document.getElementById('contestTitle').textContent = `BẢNG XẾP HẠNG: ${data.contest.name}`;

        const probs = data.contest.problems || [];
        let theadCols = probs.map(p => `
          <th style="text-align: center; width: 90px;">
            <a href="/frontend/html/contest/problem/index.html?contest=${contestKey}&problem=${p.letter}" style="color: var(--color-text); text-decoration: none;">
              ${p.letter}
            </a>
            <br>
            <span style="font-size: 0.7rem; color: var(--color-text-muted);">${p.points}p</span>
          </th>
        `).join('');

        let rows = data.scoreboard.map(row => {
          let probCols = probs.map(p => {
            const pInfo = row.problems[p.letter] || { status: 'none', score: 0 };
            if (pInfo.status === 'AC') {
              return `<td style="text-align: center; background: rgba(16, 185, 129, 0.08); color: #34d399; font-weight: 700;">+${pInfo.tries}<br><span style="font-size: 0.75rem; color: var(--color-text-muted);">${pInfo.time}'</span></td>`;
            } else if (pInfo.status === 'WA') {
              return `<td style="text-align: center; background: rgba(239, 68, 68, 0.08); color: #f87171; font-weight: 700;">-${pInfo.tries}</td>`;
            }
            return `<td style="text-align: center; color: #475569;">—</td>`;
          }).join('');

          return `
            <tr>
              <td style="text-align: center; font-weight: 800; color: ${row.rank <= 3 ? '#fbbf24' : '#f8fafc'}; font-size: 1.15rem;">
                ${row.rank <= 3 ? ['🥇', '🥈', '🥉'][row.rank - 1] + ' ' : ''}${row.rank}
              </td>
              <td>
                <div style="font-weight: 700; color: var(--color-primary); font-size: 1rem;">${row.user}</div>
                <div style="font-size: 0.75rem; color: var(--color-text-muted);">${row.rank_title || 'Thí sinh'}</div>
              </td>
              <td style="text-align: center; font-weight: 800; color: #34d399; font-size: 1.1rem;">${row.solved}</td>
              <td style="text-align: center; font-weight: 800; color: var(--color-text); font-size: 1.1rem;">${row.total_score}</td>
              <td style="text-align: center; color: var(--color-text-muted);">${row.penalty}</td>
              ${probCols}
            </tr>
          `;
        }).join('');

        wrapper.innerHTML = `
          <table class="contest-problem-table">
            <thead>
              <tr>
                <th style="width: 70px; text-align: center;">Hạng</th>
                <th>Thí sinh</th>
                <th style="width: 70px; text-align: center;">AC</th>
                <th style="width: 90px; text-align: center;">Tổng điểm</th>
                <th style="width: 80px; text-align: center;">Phạt</th>
                ${theadCols}
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        `;
      } catch (err) {
        wrapper.innerHTML = `<div style="text-align: center; color: #f87171; padding: 2rem;">Lỗi tải bảng điểm: ${err.message}</div>`;
      }
    }

    document.getElementById('btnReload').onclick = loadScoreboard;
    loadScoreboard();
  </script>
  <script src="/frontend/js/core/theme.js"></script>
  <script src="/frontend/js/core/i18n.js"></script>
</body>
</html>
