<!DOCTYPE html>
<html lang="vi">
<head>
  <link rel="icon" type="image/svg+xml" href="/frontend/assets/icons/favicon.svg">
  <link rel="stylesheet" href="/frontend/css/global/icons.css">
  <script src="/frontend/js/core/icons.js"></script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập Quản trị | Coding Platform</title>
  <link rel="stylesheet" href="/frontend/css/global/reset.css">
  <link rel="stylesheet" href="/frontend/css/global/variables.css">
  <link rel="stylesheet" href="/frontend/css/global/typography.css">
  <link rel="stylesheet" href="/frontend/css/global/common.css">
  <link rel="stylesheet" href="/frontend/css/components/navbar.css">
  <link rel="stylesheet" href="/frontend/css/components/card.css">
  <link rel="stylesheet" href="/frontend/css/components/table.css">
  <link rel="stylesheet" href="/frontend/css/responsive/mobile.css">
  <link rel="stylesheet" href="/frontend/css/global/theme.css">
  <link rel="stylesheet" href="/frontend/css/global/site-refresh.css">
</head>
<body>
  <header class="navbar">
    <div class="container nav-container">
      <a href="/frontend/html/home/index.html" class="nav-brand">
        <svg width="28" height="28" viewBox="0 0 36 36" fill="none"><rect width="36" height="36" rx="8" fill="#DC2626"/><path d="M12 12L7 20L12 28M24 12L29 20L24 28M19 10L17 30" stroke="white" stroke-width="2.5" stroke-linecap="round"/></svg>
        <span style="color: #f87171;">CodeProOJ [ADMIN PORTAL]</span>
      </a>
      <div class="nav-actions">
        <a href="/frontend/html/home/index.html" class="btn btn-secondary">Về Trang chủ</a>
      </div>
    </div>
  </header>

  <main class="container" style="padding-top: 3rem; padding-bottom: 3rem;">
    <div style="max-width: 440px; margin: 0 auto;" class="card">
      <div style="text-align: center; margin-bottom: 1.5rem;">
        <span class="badge badge-wa" style="font-size: 0.8rem; padding: 0.3rem 0.6rem;">Khu vực Quản trị</span>
        <h2 style="margin-top: 0.75rem;">Đăng nhập Admin</h2>
      </div>

      <form id="adminLoginForm" style="display: flex; flex-direction: column; gap: 1rem;">
        <div>
          <label style="display: block; font-size: 0.875rem; margin-bottom: 0.25rem;">Tài khoản Quản trị</label>
          <input type="text" id="adminUsername" value="" placeholder="Nhập username admin" class="btn btn-secondary" style="width: 100%; text-align: left; cursor: text;" required>
        </div>
        <div>
          <label style="display: block; font-size: 0.875rem; margin-bottom: 0.25rem;">Mật khẩu</label>
          <input type="password" id="adminPassword" value="" placeholder="Nhập mật khẩu" class="btn btn-secondary" style="width: 100%; text-align: left; cursor: text;" required>
        </div>
        <div id="adminErrorAlert" style="display: none; padding: 0.75rem; border-radius: var(--radius-md); background: #450a0a; border: 1px solid #dc2626; color: var(--color-danger); font-size: 0.875rem; text-align: center;"></div>
        <button type="submit" id="adminSubmitBtn" class="btn btn-primary" style="background: #dc2626; margin-top: 0.5rem;">Đăng nhập Quản trị</button>
      </form>
    </div>
  </main>

  <script src="/frontend/js/core/config.js"></script>
  <script src="/frontend/js/core/api.js"></script>
  <script src="/frontend/js/core/auth.js"></script>
  <script src="/frontend/js/admin/login.js"></script>
  <script src="/frontend/js/core/theme.js"></script>
  <script src="/frontend/js/core/i18n.js"></script>
</body>
</html>
