<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Theo dõi mã nguồn · CodeProOJ</title>
  <style>
    :root{font-family:Inter,"Segoe UI",Arial,sans-serif;color:#e9f1ff;background:#0d1524;color-scheme:dark}
    *{box-sizing:border-box}body{margin:0;min-height:100vh}header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px clamp(16px,4vw,48px);border-bottom:1px solid #32425e;background:#19253a}header strong{font-size:18px}header strong span{color:#82aafa}header small{color:#9fb5d3}main{max-width:1440px;margin:auto;padding:28px clamp(16px,4vw,48px)}.eyebrow{color:#9fc2ff;font-size:11px;font-weight:800;letter-spacing:.14em}.heading{display:flex;align-items:start;justify-content:space-between;gap:20px;margin-bottom:24px}.heading h1{font-size:clamp(25px,4vw,38px);margin:8px 0}.heading p{margin:0;color:#a8bad4;line-height:1.5}.pill{border:1px solid #3c685c;border-radius:30px;background:#1e4039;color:#84e5b5;padding:8px 13px;font-size:12px;font-weight:750;white-space:nowrap}.pill.off{border-color:#6d4b54;background:#3d2730;color:#ffc0c8}.panel{border:1px solid #354967;border-radius:14px;background:#19253a;overflow:hidden}.panel-head{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid #31435e}.panel-head strong{font:700 13px Consolas,monospace}.panel-head small{color:#9eb2d0}.source{margin:0;min-height:55vh;max-height:calc(100vh - 250px);overflow:auto;padding:20px;color:#d8e8ff;background:#0e192b;font:14px/1.6 Consolas,"Cascadia Code",monospace;tab-size:4;white-space:pre}#error{color:#ffc0c8;line-height:1.5}footer{padding:20px;color:#8ea4c3;font-size:12px;text-align:center}a{color:#9fc2ff}@media(max-width:650px){.heading{display:block}.pill{display:inline-block;margin-top:15px}.source{font-size:12px;min-height:60vh}}
  </style>
  <link rel="stylesheet" href="/frontend/css/global/site-refresh.css">
</head>
<body>
  <header><strong>CodePro<span>OJ</span> · Spectator</strong><small>Chế độ chỉ xem</small></header>
  <main>
    <div class="heading"><div><span class="eyebrow">ĐANG THEO DÕI MÃ NGUỒN</span><h1 id="problem">Đang kết nối…</h1><p id="meta">Đang tải phiên chia sẻ.</p></div><span id="status" class="pill">Đang kết nối</span></div>
    <div id="error" role="alert" hidden></div>
    <section class="panel" aria-label="Mã nguồn được chia sẻ"><div class="panel-head"><strong id="file">main.cpp</strong><small id="updated">—</small></div><pre id="source" class="source" aria-live="off"></pre></section>
  </main>
  <footer>Liên kết chỉ xem. Mã nguồn tự cập nhật khi người chia sẻ đang viết.</footer>
  <script>
  (() => {
    const token = location.pathname.split('/').filter(Boolean).pop();
    const source = document.getElementById('source');
    const status = document.getElementById('status');
    let pending = false;
    let lastUpdated = '';
    async function refresh() {
      if (pending) return;
      pending = true;
      try {
        const response = await fetch(`/api/v2/code-share/${encodeURIComponent(token)}`, { cache: 'no-store' });
        const payload = await response.json();
        if (!response.ok || !payload?.data) throw new Error(payload?.error?.message || 'Không tải được phiên chia sẻ.');
        const share = payload.data;
        document.getElementById('problem').textContent = `${share.problem} · ${share.problem_name}`;
        document.getElementById('meta').textContent = `${share.owner} đang chia sẻ${share.contest ? ` trong cuộc thi ${share.contest}` : ''} · ${share.language}`;
        document.getElementById('file').textContent = /^PY/i.test(share.language) ? 'main.py' : 'main.cpp';
        if (lastUpdated !== share.updated_at) { source.textContent = share.source || ''; lastUpdated = share.updated_at; }
        document.getElementById('updated').textContent = `Cập nhật ${new Date(share.updated_at).toLocaleTimeString('vi-VN')}`;
        document.getElementById('error').hidden = true;
        status.textContent = 'Đang chia sẻ'; status.classList.remove('off');
      } catch (error) {
        source.textContent = '';
        document.getElementById('error').textContent = error.message;
        document.getElementById('error').hidden = false;
        status.textContent = 'Đã ngừng chia sẻ'; status.classList.add('off');
      } finally { pending = false; }
    }
    function connect() {
      const socket = new WebSocket(`${location.protocol === 'https:' ? 'wss:' : 'ws:'}//${location.host}/ws/live`);
      socket.addEventListener('message', event => {
        try { const data = JSON.parse(event.data); if (data.type === 'invalidate' && data.topics?.includes('shares')) refresh(); } catch {}
      });
      socket.addEventListener('close', () => setTimeout(connect, 3000));
      socket.addEventListener('error', () => socket.close());
    }
    if (!/^[A-Za-z0-9_-]{20,64}$/.test(token)) { document.getElementById('error').textContent = 'Liên kết không hợp lệ.'; document.getElementById('error').hidden = false; return; }
    refresh(); connect(); setInterval(refresh, 5000);
  })();
  </script>
</body>
</html>
