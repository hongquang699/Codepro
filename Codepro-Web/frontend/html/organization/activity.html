<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nhật ký Hoạt động | CodeProOJ</title>
  <link rel="icon" type="image/svg+xml" href="/frontend/assets/icons/favicon.svg">
  <link rel="stylesheet" href="/frontend/css/global/reset.css">
  <link rel="stylesheet" href="/frontend/css/global/variables.css">
  <link rel="stylesheet" href="/frontend/css/global/typography.css">
  <link rel="stylesheet" href="/frontend/css/global/common.css">
  <link rel="stylesheet" href="/frontend/css/global/icons.css">
  <link rel="stylesheet" href="/frontend/css/components/navbar.css">
  <link rel="stylesheet" href="/frontend/css/components/card.css">
  <link rel="stylesheet" href="/frontend/css/responsive/mobile.css">
  <link rel="stylesheet" href="/frontend/css/organization/organization.css">
  <link rel="stylesheet" href="/frontend/css/global/theme.css">
  <script src="/frontend/js/core/icons.js"></script>
  <link rel="stylesheet" href="/frontend/css/global/site-refresh.css">
</head>
<body>
  <header class="navbar">
    <div class="container nav-container"></div>
  </header>

  <main class="org-container">
    <div id="orgHeaderTarget"></div>

    <div class="org-panel">
      <div style="margin-bottom:1.5rem;">
        <h3 class="org-panel-title">⚡ Dòng Thời Gian &amp; Hoạt Động Của Tổ Chức</h3>
      </div>

      <div id="activityContainer" style="display:flex;flex-direction:column;gap:1rem;position:relative;padding-left:1.5rem;border-left: 2px solid var(--color-border-subtle);">
        <div style="text-align:center;padding:3rem;color: var(--color-text-muted);">Đang tải nhật ký hoạt động...</div>
      </div>
    </div>
  </main>

  <script src="/frontend/js/core/config.js"></script>
  <script src="/frontend/js/core/auth.js"></script>
  <script src="/frontend/js/components/navbar.js"></script>
  <script src="/frontend/js/organization/organization-api.js"></script>
  <script>
    (async () => {
      const slug = OrgAPI.getOrgSlugFromUrl();
      const orgRes = await OrgAPI.getOrg(slug);
      if (orgRes.status === 200 && orgRes.data) {
        OrgAPI.renderHeader(orgRes.data, 'activity');
      }

      const res = await OrgAPI.getActivity(slug);
      const container = document.getElementById('activityContainer');
      const items = res.data || [];

      if (items.length === 0) {
        container.innerHTML = '<div style="text-align:center;padding:3rem;color: var(--color-text-muted);">Chưa có hoạt động nào được ghi nhận.</div>';
        return;
      }

      container.innerHTML = items.map(a => `
        <div style="position:relative;padding:1rem 1.25rem;background: var(--color-surface);border: 1px solid var(--color-card-border);border-radius:10px;">
          <div style="position:absolute;left:-2.05rem;top:1.25rem;width:14px;height:14px;border-radius:50%;background: var(--color-primary);border: 3px solid #0f172a;"></div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;flex-wrap:wrap;gap:.5rem;">
            <div style="font-weight:700;color: var(--color-text);font-size:.95rem;">
              ${a.target_title || a.action}
            </div>
            <div style="font-size:.78rem;color: var(--color-text-muted);">
              ${new Date(a.created_at).toLocaleDateString('vi-VN')} ${new Date(a.created_at).toLocaleTimeString('vi-VN', {hour:'2-digit', minute:'2-digit'})}
            </div>
          </div>
          <div style="font-size:.84rem;color: var(--color-text-secondary);">
            Thực hiện bởi: <a href="/profile/${a.username}" style="color: var(--color-primary);font-weight:600;text-decoration:none;">${a.username}</a>
          </div>
        </div>
      `).join('');
    })();
  </script>
</body>
</html>
