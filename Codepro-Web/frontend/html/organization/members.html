<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thành viên Tổ chức | CodeProOJ</title>
  <link rel="icon" type="image/svg+xml" href="/frontend/assets/icons/favicon.svg">
  <link rel="stylesheet" href="/frontend/css/global/reset.css">
  <link rel="stylesheet" href="/frontend/css/global/variables.css">
  <link rel="stylesheet" href="/frontend/css/global/typography.css">
  <link rel="stylesheet" href="/frontend/css/global/common.css">
  <link rel="stylesheet" href="/frontend/css/global/icons.css">
  <link rel="stylesheet" href="/frontend/css/components/navbar.css">
  <link rel="stylesheet" href="/frontend/css/components/card.css">
  <link rel="stylesheet" href="/frontend/css/components/table.css">
  <link rel="stylesheet" href="/frontend/css/responsive/mobile.css">
  <link rel="stylesheet" href="/frontend/css/organization/organization.css">
  <link rel="stylesheet" href="/frontend/css/global/theme.css">
  <script src="/frontend/js/core/icons.js"></script>
  <link rel="stylesheet" href="/frontend/css/global/site-refresh.css">
</head>
<body>
  <header class="navbar">
    <div class="container nav-container"></div>
  </header>

  <main class="org-container">
    <div id="orgHeaderTarget"></div>

    <div class="org-panel">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem;flex-wrap:wrap;gap:1rem;">
        <h3 class="org-panel-title">👥 Danh Sách Thành Viên (<span id="memberCountHeader">0</span>)</h3>

        <div style="display:flex;gap:.75rem;align-items:center;flex-wrap:wrap;">
          <select id="roleFilterSelect" style="background: var(--color-bg-secondary);border: 1px solid var(--color-border);border-radius:8px;padding:.55rem .85rem;color: #fff;outline: none;">
            <option value="all">Tất cả vai trò</option>
            <option value="Owner">Owner</option>
            <option value="Administrator">Administrator</option>
            <option value="Moderator">Moderator</option>
            <option value="Problem Setter">Problem Setter</option>
            <option value="Contest Manager">Contest Manager</option>
            <option value="Member">Member</option>
          </select>
          <input type="text" id="memberSearchInput" placeholder="Tìm thành viên..." style="background: var(--color-bg-secondary);border: 1px solid var(--color-border);border-radius:8px;padding:.55rem .95rem;color: #fff;outline: none;min-width:220px;">
        </div>
      </div>

      <div style="overflow-x:auto;">
        <table class="table-custom" style="width:100%;">
          <thead>
            <tr>
              <th style="width:50px;">#</th>
              <th>Thành viên</th>
              <th style="text-align:center;">Vai trò</th>
              <th style="text-align:center;">Rating Elo</th>
              <th style="text-align:center;">Bài đã giải</th>
              <th style="text-align:right;">Ngày tham gia</th>
            </tr>
          </thead>
          <tbody id="membersTbody">
            <tr><td colspan="6" style="text-align:center;padding:2.5rem;color: var(--color-text-muted);">Đang tải danh sách thành viên...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="/frontend/js/core/config.js"></script>
  <script src="/frontend/js/core/auth.js"></script>
  <script src="/frontend/js/components/navbar.js"></script>
  <script src="/frontend/js/organization/organization-api.js"></script>
  <script>
    (async () => {
      const slug = OrgAPI.getOrgSlugFromUrl();
      const orgRes = await OrgAPI.getOrg(slug);
      if (orgRes.status === 200 && orgRes.data) {
        OrgAPI.renderHeader(orgRes.data, 'members');
      }

      async function renderMembers() {
        const role = document.getElementById('roleFilterSelect').value;
        const search = document.getElementById('memberSearchInput').value;
        const res = await OrgAPI.getMembers(slug, role, search);
        const tbody = document.getElementById('membersTbody');
        document.getElementById('memberCountHeader').textContent = res.total || (res.data ? res.data.length : 0);

        if (!res.data || res.data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:2.5rem;color: var(--color-text-muted);">Không tìm thấy thành viên nào.</td></tr>';
          return;
        }

        let idx = 1;
        tbody.innerHTML = res.data.map(m => `
          <tr>
            <td style="color: var(--color-text-dim);font-weight:700;">${idx++}</td>
            <td>
              <div style="display:flex;align-items:center;gap:.75rem;">
                <div style="width:36px;height:36px;border-radius:50%;background: var(--color-card);display:flex;align-items:center;justify-content:center;font-weight:800;color: var(--color-primary);border: 1px solid var(--color-border);">
                  ${m.username.charAt(0).toUpperCase()}
                </div>
                <div>
                  <div style="display:flex;align-items:center;gap:.35rem;">
                    <a href="/profile/${m.username}" style="font-weight:700;color: var(--color-primary);text-decoration:none;">${m.username}</a>
                    ${m.is_verified ? `
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
                        <path d="M9 12L11 14L15 10M12 3L13.91 4.26L16.14 3.73L17.55 5.48L19.78 5.74L20.31 7.97L22.06 9.38L21.53 11.61L22.79 13.52L21.53 15.43L22.06 17.66L20.31 19.07L19.78 21.3L17.55 21.56L16.14 23.31L13.91 22.78L12 24.04L10.09 22.78L7.86 23.31L6.45 21.56L4.22 21.3L3.69 19.07L1.94 17.66L2.47 15.43L1.21 13.52L2.47 11.61L1.94 9.38L3.69 7.97L4.22 5.74L6.45 5.48L7.86 3.73L10.09 4.26L12 3Z" fill="#38BDF8" stroke="#0284C7" stroke-width="1.2"/>
                        <path d="M8.5 12.5L11 15L16 9" stroke="white" stroke-width="2"/>
                      </svg>
                    ` : ''}
                  </div>
                  <div style="font-size:.78rem;color: var(--color-text-muted);">${m.display_name}</div>
                </div>
              </div>
            </td>
            <td style="text-align:center;">
              <span style="font-size:.78rem;font-weight:700;padding:.25rem .65rem;border-radius:6px;background: rgba(255,255,255,.08);color: ${m.role_color};">
                ${m.role_name}
              </span>
            </td>
            <td style="text-align:center;">
              <strong style="color: var(--color-text);">${m.rating}</strong>
              <div style="font-size:.75rem;color: var(--color-text-muted);">${m.display_rank}</div>
            </td>
            <td style="text-align:center;font-weight:600;">
              ${m.solved_count}
            </td>
            <td style="text-align:right;color: var(--color-text-muted);font-size:.84rem;">
              ${new Date(m.joined_at).toLocaleDateString('vi-VN')}
            </td>
          </tr>
        `).join('');
      }

      document.getElementById('roleFilterSelect').addEventListener('change', renderMembers);
      document.getElementById('memberSearchInput').addEventListener('input', renderMembers);
      renderMembers();
    })();
  </script>
</body>
</html>
