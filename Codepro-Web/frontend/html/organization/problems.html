<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kho Bài tập Tổ chức | CodeProOJ</title>
  <link rel="icon" type="image/svg+xml" href="/frontend/assets/icons/favicon.svg">
  <link rel="stylesheet" href="/frontend/css/global/reset.css">
  <link rel="stylesheet" href="/frontend/css/global/variables.css">
  <link rel="stylesheet" href="/frontend/css/global/typography.css">
  <link rel="stylesheet" href="/frontend/css/global/common.css">
  <link rel="stylesheet" href="/frontend/css/global/icons.css">
  <link rel="stylesheet" href="/frontend/css/components/navbar.css">
  <link rel="stylesheet" href="/frontend/css/components/card.css">
  <link rel="stylesheet" href="/frontend/css/components/table.css">
  <link rel="stylesheet" href="/frontend/css/responsive/mobile.css">
  <link rel="stylesheet" href="/frontend/css/organization/organization.css">
  <link rel="stylesheet" href="/frontend/css/global/theme.css">
  <script src="/frontend/js/core/icons.js"></script>
  <link rel="stylesheet" href="/frontend/css/global/site-refresh.css">
</head>
<body>
  <header class="navbar">
    <div class="container nav-container"></div>
  </header>

  <main class="org-container">
    <div id="orgHeaderTarget"></div>

    <div class="org-panel">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;flex-wrap:wrap;gap:1rem;">
        <h3 class="org-panel-title">📝 Kho Bài Tập Chuyên Đề (<span id="problemsCount">0</span>)</h3>

        <div style="display:flex;gap:.75rem;align-items:center;flex-wrap:wrap;">
          <select id="diffFilter" style="background: var(--color-bg-secondary);border: 1px solid var(--color-border);border-radius:8px;padding:.55rem .85rem;color: #fff;outline: none;">
            <option value="all">Tất cả độ khó</option>
            <option value="Easy">Dễ (Easy)</option>
            <option value="Medium">Trung bình (Medium)</option>
            <option value="Hard">Khó (Hard)</option>
          </select>
          <input type="text" id="probSearch" placeholder="Tìm mã bài / tên bài..." style="background: var(--color-bg-secondary);border: 1px solid var(--color-border);border-radius:8px;padding:.55rem .95rem;color: #fff;outline: none;min-width:220px;">
        </div>
      </div>

      <div style="overflow-x:auto;">
        <table class="table-custom" style="width:100%;">
          <thead>
            <tr>
              <th style="width:100px;">Mã bài</th>
              <th>Tên bài tập</th>
              <th style="width:120px;text-align:center;">Độ khó</th>
              <th style="width:100px;text-align:center;">Điểm</th>
              <th style="width:120px;text-align:center;">Đã giải</th>
              <th style="width:120px;text-align:center;">Tỷ lệ AC</th>
              <th style="width:120px;text-align:right;">Thao tác</th>
            </tr>
          </thead>
          <tbody id="problemsTbody">
            <tr><td colspan="7" style="text-align:center;padding:2.5rem;color: var(--color-text-muted);">Đang tải danh sách bài tập...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="/frontend/js/core/config.js"></script>
  <script src="/frontend/js/core/auth.js"></script>
  <script src="/frontend/js/components/navbar.js"></script>
  <script src="/frontend/js/organization/organization-api.js"></script>
  <script>
    (async () => {
      const slug = OrgAPI.getOrgSlugFromUrl();
      const orgRes = await OrgAPI.getOrg(slug);
      if (orgRes.status === 200 && orgRes.data) {
        OrgAPI.renderHeader(orgRes.data, 'problems');
      }

      async function renderProblems() {
        const diff = document.getElementById('diffFilter').value;
        const search = document.getElementById('probSearch').value;
        const res = await OrgAPI.getProblems(slug, diff, search);
        const tbody = document.getElementById('problemsTbody');
        document.getElementById('problemsCount').textContent = res.data ? res.data.length : 0;

        if (!res.data || res.data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:2.5rem;color: var(--color-text-muted);">Không có bài tập nào.</td></tr>';
          return;
        }

        tbody.innerHTML = res.data.map(p => `
          <tr>
            <td style="font-family:monospace;font-weight:800;color: var(--color-primary);">${p.code}</td>
            <td>
              <a href="/problem?code=${p.code}" style="font-weight:700;color: var(--color-text);text-decoration:none;font-size:.95rem;">
                ${p.name}
              </a>
              <div style="font-size:.78rem;color: var(--color-text-muted);margin-top:2px;">
                Giới hạn: ${p.time_limit}s • ${(p.memory_limit || 256)}MB
              </div>
            </td>
            <td style="text-align:center;">
              <span style="font-size:.76rem;font-weight:700;padding:.2rem .6rem;border-radius:6px;background: ${p.difficulty === 'Easy' ? 'rgba(16,185,129,.15);color: #10b981;' : (p.difficulty === 'Medium' ? 'rgba(245,158,11,.15);color: #f59e0b;' : 'rgba(239,68,68,.15);color: #ef4444;')}">
                ${p.difficulty}
              </span>
            </td>
            <td style="text-align:center;font-weight:700;color: var(--color-text-secondary);">${p.points}</td>
            <td style="text-align:center;font-weight:600;color: var(--color-text);">${p.solved_count.toLocaleString()}</td>
            <td style="text-align:center;">
              <div style="font-weight:700;color: ${p.ac_rate > 50 ? '#10b981' : '#f59e0b'};font-size:.85rem;">${p.ac_rate}%</div>
              <div style="font-size:.72rem;color: var(--color-text-dim);">(${p.total_submissions} nộp)</div>
            </td>
            <td style="text-align:right;">
              <a href="/problem?code=${p.code}" class="btn-org-cta" style="padding:.35rem .85rem;font-size:.82rem;">
                Làm bài
              </a>
            </td>
          </tr>
        `).join('');
      }

      document.getElementById('diffFilter').addEventListener('change', renderProblems);
      document.getElementById('probSearch').addEventListener('input', renderProblems);
      renderProblems();
    })();
  </script>
</body>
</html>
