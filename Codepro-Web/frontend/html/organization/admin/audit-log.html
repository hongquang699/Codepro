<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nhật ký Kiểm toán Tổ chức | CodeProOJ</title>
  <link rel="icon" type="image/svg+xml" href="/frontend/assets/icons/favicon.svg">
  <link rel="stylesheet" href="/frontend/css/global/reset.css">
  <link rel="stylesheet" href="/frontend/css/global/variables.css">
  <link rel="stylesheet" href="/frontend/css/global/typography.css">
  <link rel="stylesheet" href="/frontend/css/global/common.css">
  <link rel="stylesheet" href="/frontend/css/global/icons.css">
  <link rel="stylesheet" href="/frontend/css/components/navbar.css">
  <link rel="stylesheet" href="/frontend/css/components/card.css">
  <link rel="stylesheet" href="/frontend/css/components/table.css">
  <link rel="stylesheet" href="/frontend/css/responsive/mobile.css">
  <link rel="stylesheet" href="/frontend/css/organization/organization.css">
  <link rel="stylesheet" href="/frontend/css/organization/admin.css">
  <link rel="stylesheet" href="/frontend/css/global/theme.css">
  <script src="/frontend/js/core/icons.js"></script>
  <link rel="stylesheet" href="/frontend/css/global/site-refresh.css">
</head>
<body>
  <header class="navbar">
    <div class="container nav-container"></div>
  </header>

  <main class="org-container">
    <div class="org-admin-layout">
      <aside id="orgAdminSidebar"></aside>

      <section class="org-admin-content">
        <div class="org-admin-header">
          <div>
            <h2 style="font-size:1.45rem;font-weight:800;color: var(--color-text);margin:0;">
              🔒 Nhật Ký Kiểm Toán (Audit Trail)
            </h2>
            <p style="font-size:.84rem;color: var(--color-text-muted);margin-top:2px;">
              Lưu trữ mọi hành vi can thiệp dữ liệu, cập nhật phân quyền và quản trị hệ thống.
            </p>
          </div>
        </div>

        <div style="overflow-x:auto;">
          <table class="table-custom" style="width:100%;font-size:.88rem;">
            <thead>
              <tr>
                <th style="width:160px;">Hành động</th>
                <th>Mục tiêu / Đối tượng</th>
                <th>Người thực hiện</th>
                <th style="text-align:center;">IP Address</th>
                <th>Chi tiết</th>
                <th style="text-align:right;width:150px;">Thời gian</th>
              </tr>
            </thead>
            <tbody id="adminAuditTbody">
              <tr><td colspan="6" style="text-align:center;padding:2.5rem;color: var(--color-text-muted);">Đang tải nhật ký kiểm toán...</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </div>
  </main>

  <script src="/frontend/js/core/config.js"></script>
  <script src="/frontend/js/core/auth.js"></script>
  <script src="/frontend/js/components/navbar.js"></script>
  <script src="/frontend/js/organization/organization-api.js"></script>
  <script src="/frontend/js/organization/admin.js"></script>
  <script>
    const slug = OrgAPI.getOrgSlugFromUrl();
    OrgAdmin.renderSidebar(slug, 'audit-log');

    async function loadAuditLog() {
      const res = await OrgAPI.getAdminAuditLog(slug);
      const tbody = document.getElementById('adminAuditTbody');
      if (!res.data || res.data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:2.5rem;color: var(--color-text-muted);">Chưa có bản ghi kiểm toán nào.</td></tr>';
        return;
      }

      tbody.innerHTML = res.data.map(l => `
        <tr>
          <td>
            <span style="font-family:monospace;font-weight:700;color: #f59e0b;font-size:.8rem;background: var(--color-bg);padding:2px 6px;border-radius:4px;border: 1px solid var(--color-border);">
              ${l.action}
            </span>
          </td>
          <td><strong style="color: var(--color-text);">${l.target}</strong></td>
          <td style="color: var(--color-primary);font-weight:600;">${l.actor_username}</td>
          <td style="text-align:center;font-family:monospace;color: var(--color-text-muted);font-size:.8rem;">${l.ip}</td>
          <td style="color: var(--color-text-secondary);font-size:.84rem;">${l.details || '—'}</td>
          <td style="text-align:right;color: var(--color-text-dim);font-size:.8rem;">
            ${new Date(l.created_at).toLocaleDateString('vi-VN')} ${new Date(l.created_at).toLocaleTimeString('vi-VN', {hour:'2-digit', minute:'2-digit'})}
          </td>
        </tr>
      `).join('');
    }

    loadAuditLog();
  </script>
</body>
</html>
