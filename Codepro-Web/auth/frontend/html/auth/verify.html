<!DOCTYPE html>
<html lang="vi">
<head>
  <link rel="icon" type="image/svg+xml" href="/frontend/assets/icons/favicon.svg">
  <link rel="stylesheet" href="/frontend/css/global/icons.css">
  <script src="/frontend/js/core/icons.js"></script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xác Thực Email Tài Khoản | CodeProOJ</title>
  <link rel="stylesheet" href="/frontend/css/global/reset.css">
  <link rel="stylesheet" href="/frontend/css/global/variables.css">
  <link rel="stylesheet" href="/frontend/css/global/typography.css">
  <link rel="stylesheet" href="/frontend/css/global/common.css">
  <link rel="stylesheet" href="/frontend/css/components/navbar.css">
  <link rel="stylesheet" href="/frontend/css/components/card.css">
  <link rel="stylesheet" href="/frontend/css/responsive/mobile.css">
  <style>
    body {
      background: radial-gradient(circle at 50% 20%, #1e293b 0%, #0b0f19 80%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .auth-center {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .auth-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 14px;
      padding: 2.5rem;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      text-align: center;
    }
  </style>
  <link rel="stylesheet" href="/frontend/css/global/theme.css">
  <link rel="stylesheet" href="/frontend/css/global/site-refresh.css">
</head>
<body>
  <header class="navbar">
    <div class="container nav-container">
      <a href="/" class="nav-brand">
        <svg width="28" height="28" viewBox="0 0 36 36" fill="none"><rect width="36" height="36" rx="8" fill="#2563EB"/><path d="M12 12L7 20L12 28M24 12L29 20L24 28M19 10L17 30" stroke="white" stroke-width="2.5" stroke-linecap="round"/></svg>
        <span>CodeProOJ</span>
      </a>
    </div>
  </header>

  <div class="auth-center">
    <div class="auth-card">
      <div style="font-size: 3rem; margin-bottom: 0.75rem;">✉️</div>
      <h2 style="font-size: 1.5rem; font-weight: 800; color: #fff; margin-bottom: 0.5rem;">Kiểm Tra Hộp Thư Email</h2>
      <p style="color: #94a3b8; font-size: 0.95rem; line-height: 1.5; margin-bottom: 1.5rem;">
        Chúng tôi đã gửi một liên kết xác minh tài khoản đến email của bạn. Vui lòng bấm vào liên kết trong thư để kích hoạt tài khoản.
      </p>

      <a href="/frontend/html/auth/login.html" class="btn btn-primary" style="display:block; padding: 0.75rem; text-decoration: none; font-weight: 700; margin-bottom: 1rem;">
        Đã Kích Hoạt &rarr; Đăng Nhập Ngay
      </a>

      <button type="button" class="btn btn-secondary" onclick="alert('Đã gửi lại email kích hoạt mới!');" style="width: 100%; padding: 0.75rem;">
        🔄 Gửi lại Email Xác minh
      </button>
    </div>
  </div>
  <script src="/frontend/js/core/theme.js"></script>
  <script src="/frontend/js/core/i18n.js"></script>
</body>
</html>
