<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập tài khoản | CodeProOJ</title>
  <link rel="icon" type="image/svg+xml" href="/frontend/assets/icons/favicon.svg">
  <link rel="stylesheet" href="/frontend/css/global/reset.css">
  <link rel="stylesheet" href="/frontend/css/global/variables.css">
  <link rel="stylesheet" href="/frontend/css/global/icons.css">
  <link rel="stylesheet" href="/frontend/css/auth/login.css">
  <script src="/frontend/js/core/icons.js"></script>
  <link rel="stylesheet" href="/frontend/css/global/site-refresh.css">
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-card login-card">
      <div class="auth-header">
        <a href="/" class="auth-logo-wrap" title="Về trang chủ">
          <svg width="32" height="32" viewBox="0 0 36 36" fill="none">
            <rect width="36" height="36" rx="8" fill="#2563EB"/>
            <path d="M12 12L7 20L12 28M24 12L29 20L24 28M19 10L17 30" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
          </svg>
        </a>
        <h1 class="auth-title">Đăng nhập tài khoản</h1>
        <p class="auth-subtitle">Chào mừng bạn quay trở lại với CodeProOJ</p>
      </div>

      <div id="authAlert" class="auth-alert"></div>

      <form id="loginForm" class="auth-form">
        <div class="auth-form-group">
          <label class="auth-label" for="username">Username / Email</label>
          <div class="auth-input-wrap">
            <input type="text" id="username" class="auth-input" placeholder="Tên đăng nhập hoặc email" required autocomplete="username" autofocus>
          </div>
        </div>

        <div class="auth-form-group">
          <label class="auth-label" for="password">Mật khẩu</label>
          <div class="auth-input-wrap">
            <input type="password" id="password" class="auth-input" placeholder="••••••••••••••" required autocomplete="current-password">
            <button type="button" id="togglePasswordBtn" class="auth-input-icon" aria-label="Hiện mật khẩu">
              <i data-icon="eye"></i>
            </button>
          </div>
        </div>

        <div class="auth-row-between login-extra-row">
          <label class="auth-checkbox-group">
            <input type="checkbox" id="rememberMe" checked>
            <span>Ghi nhớ đăng nhập</span>
          </label>
          <a href="/forgot-password" class="auth-link" style="font-size: 0.85rem;">Quên mật khẩu?</a>
        </div>

        <button type="submit" id="loginSubmitBtn" class="auth-btn-primary">
          <span>ĐĂNG NHẬP</span>
        </button>
      </form>

      <div class="auth-divider">
        <span>hoặc</span>
      </div>

      <div class="auth-oauth-group">
        <button type="button" class="auth-oauth-btn" onclick="alert('Tính năng đăng nhập Google đang được kết nối')">
          <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.7l3.1-3.1C17.3 1.8 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.4 9 5 12 5z"/><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.6h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.9z"/><path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.8s.2-2.1.4-2.8L1.9 6.3C.7 8.7 0 10.3 0 12s.7 3.3 1.9 5.7l3.7-2.9z"/><path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2-6.4-4.8L1.9 16.4C3.7 20.1 7.5 23 12 23z"/></svg>
          <span>Google</span>
        </button>
        <button type="button" class="auth-oauth-btn" onclick="alert('Tính năng đăng nhập GitHub đang được kết nối')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/></svg>
          <span>GitHub</span>
        </button>
      </div>

      <div class="auth-footer">
        Chưa có tài khoản? <a href="/register" class="auth-link">Đăng ký ngay</a>
      </div>
    </div>
  </div>

  <script src="/frontend/js/auth/auth.js"></script>
  <script src="/frontend/js/auth/login.js"></script>
</body>
</html>
