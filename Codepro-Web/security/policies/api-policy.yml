# CODING_OJ API Security Policy
version: 1.0
rate_limiting:
  enabled: true
  anonymous:
    requests_per_minute: 60
    burst: 10
  authenticated:
    requests_per_minute: 300
    burst: 30
  submission:
    submissions_per_minute: 10
    interval_seconds_between_submits: 3
  admin:
    requests_per_minute: 600

cors:
  allow_credentials: true
  allowed_origins:
    - "http://localhost:3000"
    - "http://localhost:8000"
    - "http://127.0.0.1:3000"
    - "http://127.0.0.1:8000"
  allowed_methods:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
    - OPTIONS
  allowed_headers:
    - Authorization
    - Content-Type
    - X-CSRF-Token
    - X-Requested-With

security_headers:
  hsts_seconds: 31536000
  frame_options: DENY
  content_type_options: nosniff
  xss_protection: "1; mode=block"
  content_security_policy: "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:;"
