# CODING_OJ Password Policy Configuration
version: 1.0
requirements:
  min_length: 8
  max_length: 128
  require_uppercase: true
  require_lowercase: true
  require_numbers: true
  require_special_characters: true
  min_entropy_bits: 40
  prevent_common_passwords: true
  prevent_username_in_password: true

expiration:
  admin_days: 90
  user_days: 0 # Never expires for normal users
  history_disallowed_count: 5

lockout:
  max_failed_attempts: 5
  lockout_duration_minutes: 15
  auto_unlock: true
