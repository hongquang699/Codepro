services:
  postgres:
    image: postgres:16-alpine
    container_name: codeprooj_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-coding_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-coding_platform}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - codeprooj_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: codeprooj_redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    networks:
      - codeprooj_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-06T17-38-46Z
    command: server /data --console-address ":9001"
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - miniodata:/data
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
    networks:
      - codeprooj_network

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 2; done;
      mc mb --ignore-existing local/$${PROBLEM_STORAGE_PRIVATE_BUCKET};
      mc mb --ignore-existing local/$${PROBLEM_STORAGE_PUBLIC_BUCKET};
      mc version enable local/$${PROBLEM_STORAGE_PRIVATE_BUCKET};
      mc anonymous set none local/$${PROBLEM_STORAGE_PRIVATE_BUCKET};
      mc anonymous set download local/$${PROBLEM_STORAGE_PUBLIC_BUCKET}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      PROBLEM_STORAGE_PRIVATE_BUCKET: ${PROBLEM_STORAGE_PRIVATE_BUCKET:-problem-private}
      PROBLEM_STORAGE_PUBLIC_BUCKET: ${PROBLEM_STORAGE_PUBLIC_BUCKET:-problem-public}
    networks:
      - codeprooj_network

  problem-storage-queue:
    build:
      context: .
      dockerfile: infrastructure/docker/problem-storage-queue/Dockerfile
    restart: always
    environment:
      REDIS_URL: redis://redis:6379/1
      PROBLEM_STORAGE_INTERNAL_TOKEN: ${PROBLEM_STORAGE_INTERNAL_TOKEN:?Set PROBLEM_STORAGE_INTERNAL_TOKEN in .env}
      BACKEND_VALIDATE_URL: http://backend:8000/api/v1/problem-storage/internal/validate
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - codeprooj_network

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/backend/Dockerfile
    container_name: codeprooj_backend
    restart: always
    environment:
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JUDGE_SECRET_TOKEN: ${JUDGE_SECRET_TOKEN:?Set JUDGE_SECRET_TOKEN in .env}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend,codeprooj.com,www.codeprooj.com}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-coding_app}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_NAME: ${DB_NAME:-coding_platform}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-False}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@codeprooj.com}
      REDIS_URL: redis://redis:6379/0
      PROBLEM_STORAGE_ENDPOINT: http://minio:9000
      PROBLEM_STORAGE_PUBLIC_ENDPOINT: ${PROBLEM_STORAGE_PUBLIC_ENDPOINT:-http://127.0.0.1:9000}
      PROBLEM_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      PROBLEM_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      PROBLEM_STORAGE_PRIVATE_BUCKET: ${PROBLEM_STORAGE_PRIVATE_BUCKET:-problem-private}
      PROBLEM_STORAGE_PUBLIC_BUCKET: ${PROBLEM_STORAGE_PUBLIC_BUCKET:-problem-public}
      PROBLEM_STORAGE_QUEUE_URL: http://problem-storage-queue:3010
      PROBLEM_STORAGE_INTERNAL_TOKEN: ${PROBLEM_STORAGE_INTERNAL_TOKEN:?Set PROBLEM_STORAGE_INTERNAL_TOKEN in .env}
      JUDGE_SERVER_URL: http://judge-server:9999
      JUDGE_AUTH_TOKEN: ${JUDGE_AUTH_TOKEN:?Set JUDGE_AUTH_TOKEN in .env}
      TRUSTED_PROXY_IPS: 172.16.0.0/12
      TRUST_PROXY_SSL_HEADER: "true"
      TESTCASE_ENCRYPTION_KEY: ${TESTCASE_ENCRYPTION_KEY:?Set TESTCASE_ENCRYPTION_KEY in .env}
      DMOJ_PROBLEM_DATA_ROOT: /var/coding-platform/problem-data/problems
      DMOJ_CONTEST_DATA_ROOT: /var/coding-platform/contest-data/contests
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./config/admin_ip_whitelist.json:/app/config/admin_ip_whitelist.json:ro
      - ./problem-data:/var/coding-platform/problem-data
      - ./contest-data:/var/coding-platform/contest-data
      - ./storage:/var/coding-platform/storage
      - staticfiles:/app/staticfiles
    networks:
      - codeprooj_network

  anti-cheat-worker:
    build:
      context: .
      dockerfile: infrastructure/docker/backend/Dockerfile
    container_name: codeprooj_anti_cheat_worker
    restart: always
    command: python manage.py run_anticheat_worker
    environment:
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend,codeprooj.com,www.codeprooj.com}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-coding_app}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_NAME: ${DB_NAME:-coding_platform}
      AI_SIMILARITY_URL: ${AI_SIMILARITY_URL:-}
      AI_SIMILARITY_TOKEN: ${AI_SIMILARITY_TOKEN:-}
    depends_on:
      - backend
      - postgres
    networks:
      - codeprooj_network

  ai-similarity:
    build:
      context: .
      dockerfile: infrastructure/docker/ai-similarity/Dockerfile
    restart: always
    environment:
      AI_SIMILARITY_TOKEN: ${AI_SIMILARITY_TOKEN:-}
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - codeprooj_network

  judge-server:
    build:
      context: .
      dockerfile: infrastructure/docker/judge/Dockerfile
    container_name: codeprooj_judge_server
    restart: always
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    pids_limit: 256
    mem_limit: 4g
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      JUDGE_NAME: codeprooj-judge-01
      BACKEND_HOST: backend
      BACKEND_PORT: 8000
      JUDGE_AUTH_TOKEN: ${JUDGE_AUTH_TOKEN:?Set JUDGE_AUTH_TOKEN in .env}
      JUDGE_QUEUE_REDIS_URL: redis://redis:6379/2
      JUDGE_PROBLEM_DATA_DIR: /var/coding-platform/problem-data/problems
      TESTCASE_ENCRYPTION_KEY: ${TESTCASE_ENCRYPTION_KEY:?Set TESTCASE_ENCRYPTION_KEY in .env}
      JUDGE_STORAGE_DIR: /var/coding-platform/storage
      PROBLEM_STORAGE_ENDPOINT: http://minio:9000
      PROBLEM_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      PROBLEM_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      PROBLEM_STORAGE_PRIVATE_BUCKET: ${PROBLEM_STORAGE_PRIVATE_BUCKET:-problem-private}
      JUDGE_LOG_DIR: /app/judge-system/logs
    depends_on:
      - backend
      - redis
    volumes:
      - ./problem-data:/var/coding-platform/problem-data:ro
      - ./storage:/var/coding-platform/storage
      - ./judge-system/logs:/app/judge-system/logs
    networks:
      - codeprooj_network

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/frontend/Dockerfile
    container_name: codeprooj_frontend
    restart: always
    environment:
      DJANGO_BACKEND_HOST: backend
      DJANGO_BACKEND_PORT: 8000
      DJANGO_PROXY_SCHEME: https
      TRUSTED_PROXY_IPS: 172.16.0.0/12
    depends_on:
      - backend
    volumes:
      - ./config/admin_ip_whitelist.json:/app/config/admin_ip_whitelist.json:ro
      - ./frontend/downloads:/app/frontend/downloads:ro
    networks:
      - codeprooj_network

  nginx:
    build:
      context: .
      dockerfile: infrastructure/docker/nginx/Dockerfile
    container_name: codeprooj_gateway
    restart: always
    ports:
      - "127.0.0.1:${CODEPRO_HTTP_PORT:-8080}:80"
    depends_on:
      - frontend
      - backend
    volumes:
      - staticfiles:/srv/staticfiles:ro
    networks:
      - codeprooj_network

volumes:
  pgdata:
  redisdata:
  miniodata:
  staticfiles:

networks:
  codeprooj_network:
    driver: bridge
